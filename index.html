<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planowanie Online</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="lobby" class="panel">
      <h1>Planowanie Online</h1>
      <p class="subtitle">Gra karciana dla 2–4 graczy</p>

      <label for="playerName">Twój nick</label>
      <input id="playerName" maxlength="20" placeholder="Wpisz nick" autocomplete="off" />

      <div class="actions">
        <button id="createRoomButton">Utwórz pokój</button>
      </div>

      <div class="join-row">
        <input id="roomCode" maxlength="5" placeholder="KOD POKOJU" autocomplete="off" />
        <button id="joinRoomButton">Dołącz</button>
      </div>

      <p id="message" class="message"></p>
    </section>

    <section id="room" class="panel hidden">
      <div class="room-header">
        <div>
          <h2>Pokój <span id="roomCodeLabel">-----</span></h2>
          <p id="phaseLabel">Oczekiwanie na graczy</p>
        </div>
        <button id="copyRoomButton" class="secondary">Kopiuj kod</button>
      </div>

      <div id="players" class="players"></div>

      <button id="startGameButton" class="start hidden">Rozpocznij grę</button>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
